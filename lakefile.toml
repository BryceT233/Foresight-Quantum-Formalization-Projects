name = "FQFP"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FQFP"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "FQFP"

# TEMPORARY: phase-0 spike target (see artifacts/spike-0/). Delete when the
# spike concludes and the real FQFP.BCH / FQFP.LieTrotter trees land.
[[lean_lib]]
name = "FQFP.Spike"
srcDir = "_spike"

# `lake exe lint-style` runs Mathlib's text-based style linters (line length, trailing
# whitespace, tabs, ...) over this project. The linters come from
# `Mathlib.Tactic.Linter.TextBased`; `scripts/LintStyle.lean` supplies the project's options
# and module list. It reads `scripts/nolints-style.txt` for per-file exceptions.
[[lean_exe]]
name = "lint-style"
srcDir = "scripts"
supportInterpreter = true
# Executables which import `Lake` must set `-lLake`.
weakLinkArgs = ["-lLake"]
